name = "jobpilot-backend"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# D1 Relational Database Binding
[[d1_databases]]
binding = "DB"
database_name = "jobpilot-d1"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"

# R2 Object Storage Binding (CVs, cover letters, and document artifacts)
[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "jobpilot-documents"

# KV Namespace Binding (Rate limiting, session cache, kill switches)
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "local-kv-placeholder"

# Environment Variables (Non-sensitive defaults)
[vars]
ENVIRONMENT = "development"
API_VERSION = "v1"
EMERGENCY_STOP_DEFAULT = "false"
